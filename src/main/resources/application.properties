spring.application.name=pilot_receiver
app.version=@project.version@

server.port=${PORT:8081}

# Подключение к MS SQL. Учётные данные задаются через переменные окружения
spring.datasource.url=${DB_URL:jdbc:sqlserver://sql_server_hostname;databaseName=pilot;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# Адреса серверов Pilot, с которых принимаются запросы (через запятую). Пусто - без ограничений
receiver.allowed-ips=${ALLOWED_IPS:}

# Совместимость со старой версией activity.cs, которая шлёт JSON в одинарных кавычках
spring.jackson.parser.allow-single-quotes=true

# Логи
logging.file.name=${LOG_DIR:logs}/pilot_receiver.log
server.tomcat.basedir=${LOG_DIR:logs}
server.tomcat.accesslog.enabled=true

# trace:
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.jdbc.core=DEBUG
